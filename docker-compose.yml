services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lieuanhtu1
      MYSQL_DATABASE: order_management_system
    ports:
      - "33066:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      # Ghi đè riêng 3 biến DB để trỏ đúng vào container mysql
      # (các biến khác như JWT_SECRET, MAIL_HOST... vẫn lấy từ .env ở trên)
      DB_URL: jdbc:mysql://mysql:3306/order_management_system
      DB_USERNAME: root
      DB_PASSWORD: lieuanhtu1
      FRONTEND_CALLBACK_URL: http://localhost:3001/oauth2/callback
    volumes:
        - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  mysql_data: